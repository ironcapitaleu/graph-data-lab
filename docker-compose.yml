services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/graph-data-lab
    ports:
      - "7474:7474" # Neo4j Browser: http://localhost:7474
      - "7687:7687" # Bolt
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "graph-data-lab", "RETURN 1"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: graph-data-lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lab"]
      interval: 5s
      retries: 20
