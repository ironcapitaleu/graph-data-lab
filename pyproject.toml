[project]
name = "graph-data-lab"
version = "0.1.0"
description = "Sandbox to test arkad's knowledge-graph data model on Neo4j and Postgres"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.28,<6",
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
